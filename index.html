<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prototipo v3 — Mini Diagnóstico HWO</title>
<style>
  :root {
    --apple: #96BC78; --apple-dark: #7CA562; --mushroom: #716D71; --dove: #BBBBBB;
    --acqua: #4DB3BC; --blue: #7C9BD6; --sand: #F6EAD1; --bg: #FFFFFF;
  }
  * { box-sizing: border-box; }
  body { margin:0; background:#FAFAF8; font-family:'Lato','Helvetica Neue',Arial,sans-serif; color:var(--mushroom); line-height:1.55; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 32px 20px 80px; }
  .logo { height: 60px; display:block; margin-bottom: 10px; }
  .rule { border:none; border-bottom:2px solid var(--apple); margin-bottom: 26px; }
  .badge-tag { display:inline-block; font-size:12px; letter-spacing:.08em; font-weight:700; color:#fff; background:var(--mushroom); padding:4px 10px; border-radius:3px; margin-bottom:14px;}
  h1 { font-size:26px; color:var(--mushroom); margin:0 0 10px; font-weight:700; }
  h2 { font-size:17px; color:var(--apple); text-transform:uppercase; letter-spacing:.03em; margin:26px 0 8px; }
  h3.phase-title { font-size: 20px; color: var(--mushroom); margin: 0 0 6px; }
  p { font-size:16px; margin:0 0 14px; }
  .phase-intro { background:#fff; border:1px solid #ECECE8; border-radius:6px; padding:18px 20px; margin-bottom:18px; font-size:14.5px; }
  .quiz-card { background:#fff; border:1px solid #ECECE8; border-radius:6px; padding:16px 20px; margin-bottom:12px; }
  .quiz-card label { font-weight:700; color:var(--mushroom); display:flex; align-items:center; gap:10px; font-size:15.5px; }
  .quiz-card img { width:28px; height:28px; }
  .quiz-card .scale { display:flex; align-items:center; gap:10px; margin-top:10px; }
  .quiz-card input[type=range] { flex:1; accent-color:var(--apple); }
  .scale-val { width:26px; text-align:center; font-weight:700; color:var(--apple); }
  select, input[type=text], textarea {
    width:100%; padding:9px 11px; border:1px solid #DDD; border-radius:5px; font-size:14.5px;
    font-family:inherit; color:var(--mushroom); margin-top:6px; resize:vertical;
  }
  textarea { min-height:52px; }
  .btn { display:inline-block; background:var(--apple); color:#fff; border:none; padding:14px 26px; font-size:16px; font-weight:700; border-radius:5px; cursor:pointer; font-family:inherit; }
  .btn:hover { background:var(--apple-dark); }
  .btn-block { width:100%; text-align:center; }
  #langSection { display:block; }
  #contextSection, #freeSection, #paidFormSection, #paidReportSection { display:none; }
  .lang-card { background:#fff; border:2px solid #ECECE8; border-radius:8px; padding:22px; text-align:center; cursor:pointer; margin-bottom:14px; }
  .lang-card:hover { border-color:var(--apple); }
  .lang-card .flag { font-size:32px; margin-bottom:8px; }
  .room-card { display:flex; gap:16px; background:#fff; border-left:4px solid var(--apple); padding:18px 20px; margin-bottom:18px; border-radius:2px; }
  .room-card img.icon { width:56px; height:56px; flex-shrink:0; }
  .room-title { font-size:20px; font-weight:700; color:var(--mushroom); margin:0; }
  .room-quote { font-style:italic; font-size:14.5px; margin:2px 0 8px; }
  .friction { font-size:13px; font-weight:700; margin-bottom:10px; }
  .label-sm { font-size:12.5px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; margin:10px 0 3px; }
  .bonus { font-style:italic; font-size:14px; margin-top:6px; }
  .self-line { font-style:italic; font-size:13.5px; margin-top:10px; }
  .locked-row { display:flex; align-items:center; gap:12px; padding:9px 0; opacity:.75; }
  .locked-row img { width:34px; height:34px; filter:grayscale(45%); }
  .locked-row .txt { font-size:14.5px; }
  .teaser-box { border:1px dashed var(--dove); border-radius:6px; padding:14px 16px; margin:16px 0; font-size:14.5px; font-style:italic; background:#fff; }
  .cta-box { border:2px solid var(--apple); border-radius:6px; padding:22px 24px; text-align:center; margin:22px 0; background:#fff; }
  .cta-box.blue { border-color:var(--acqua); }
  .cta-box h3 { margin:0 0 6px; font-size:19px; color:var(--mushroom); }
  .cta-box p { margin-bottom:14px; font-size:14.5px; }
  .wheel-wrap { text-align:center; margin:10px 0 6px; }
  .strength-box, .priority-box { border:2px solid var(--apple); border-radius:6px; padding:20px 22px; margin:18px 0; }
  .priority-box { border-color:var(--apple); }
  .eyebrow { font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--apple); }
  .priority-box .eyebrow { color:var(--apple); }
  .connection-box { background:#fff; border-left:4px solid var(--apple); border-radius:2px; padding:16px 20px; margin:16px 0; font-size:15px; }
  .note { font-size:13px; color:var(--dove); border-top:1px dashed #E2E2DC; margin-top:40px; padding-top:14px; }
  .demo-flag { background:var(--sand); border-radius:5px; padding:10px 14px; font-size:13px; margin-bottom:22px; }
  .tip-group { margin-bottom: 16px; }
  .tip-group h4 { margin: 0 0 4px; font-size: 15px; color: var(--mushroom); }
  .tip-group ul { margin: 4px 0 0; padding-left: 18px; }
  .tip-group li { font-size: 14px; margin-bottom: 3px; }
  .quote-block { border-left: 3px solid var(--apple); padding-left: 14px; font-style: italic; margin: 14px 0; }
</style>
</head>

<script>
const DATA = {"es": [{"key": "entryway", "label": "Entrada", "accent": "#96BC78", "quote": "Te recibo tal como llegas.", "meaning": "Es el primer filtro entre el mundo y tú — cuando está saturada, entras a tu casa ya cansada.", "order": "Define un punto fijo para lo que entra por esa puerta, sea lo que sea.", "bonus": "Agrega algo que te guste ver cada vez que llegas — un tapete, una planta, una luz cálida.", "self_line": "Esto también podría estar señalando un límite: decidir qué entra a tu espacio, y qué no.", "variants": {"sola": "Define un punto fijo para lo que entra por esa puerta.", "pareja": "Definan un lugar fijo para cada quien, sin invadir el del otro.", "ninos": "Dale a cada niño su propio gancho o canasta, a su altura.", "adolescentes": "Dale a cada adolescente su propio gancho para mochila y chamarra.", "otros": "Asignen un espacio fijo por persona, claramente diferenciado."}}, {"key": "laundry", "label": "Lavandería", "accent": "#96BC78", "quote": "Guardo lo que aún no has soltado.", "meaning": "Es la parte del día que se siente invisible — sin un sistema, se vuelve una carga silenciosa que te sigue a todas partes.", "order": "Identifica si el cuello de botella es la ropa sucia o la limpia, y resuelve solo ese paso esta semana.", "bonus": null, "self_line": "Esto también podría ser una señal de que necesitas la carga repartida, no toda sobre ti.", "variants": {"sola": "Crea un punto fijo (cesta o repisa) para que la ropa no se acumule en otra zona.", "pareja": "Hablen para definir quién lava y quién guarda — que no sea siempre la misma persona.", "ninos": "Enséñales a doblar y acomodar su propia ropa — empieza con algo simple.", "adolescentes": "Dale a cada adolescente su ciclo completo: meter, sacar, doblar y guardar.", "otros": "Definan un sistema claro de turnos para la ropa compartida."}}, {"key": "bathroom", "label": "Baño", "accent": "#96BC78", "quote": "Aquí empiezas y terminas tu día.", "meaning": "Es el espacio de tu propio cuidado — cuando se descuida, es señal de que te dejas al final de tu lista.", "order": "Limpia el lavabo justo después de tu rutina de la mañana, como un ritual, no como pendiente.", "bonus": null, "self_line": "Esto también podría hablar de cuánto te permites cuidarte a ti antes que a los demás.", "variants": null}, {"key": "kitchen", "label": "Cocina y Despensa", "accent": "#96BC78", "quote": "Alimento a todos, incluso a ti.", "meaning": "Cuidas de todos, pero el “después” de cuidar se siente como una deuda interminable.", "order": "Antes de dormir, deja el fregadero vacío — aunque sea solo eso.", "bonus": null, "self_line": "Esto también podría ser un límite pendiente: pedir que esto sea trabajo de todos, no solo tuyo.", "variants": {"sola": "Antes de dormir, deja el fregadero vacío — aunque sea solo eso.", "pareja": "Túrnense: una noche lava quien cocinó, la otra quien no.", "ninos": "Que cada niño lleve su propio plato al fregadero después de comer.", "adolescentes": "Turnos fijos de lavar y guardar — ya pueden con el proceso completo.", "otros": "Definan un sistema de turnos claro por día de la semana."}}, {"key": "living", "label": "Sala", "accent": "#96BC78", "quote": "Te espero para que por fin te sientes.", "meaning": "Es tu espacio para descansar — si está ocupado por lo de todos menos tú, tu cuerpo no logra soltar.", "order": "Al final del día, regresa a su lugar lo que no es tuyo del sillón.", "bonus": "Aparta 10 minutos ahí, solo para ti, sin pantallas.", "self_line": "Esto también podría estar señalando que te cuesta darte permiso de simplemente descansar.", "variants": {"sola": "Date permiso de usar la sala completa para ti, sin “guardarla” para visitas.", "pareja": "Acuerden una hora sin pantallas ahí, los dos, aunque sea 15 minutos.", "ninos": "Define un límite claro de juguetes: los que viven en la sala, y los que no.", "adolescentes": "Negocien un horario compartido de la pantalla principal, visible para todos.", "otros": "Acuerden qué espacios de la sala son comunes y cuáles son de uso personal."}}, {"key": "dining", "label": "Comedor", "accent": "#96BC78", "quote": "Reúno, aunque a veces me uses para todo menos eso.", "meaning": "Es el lugar donde deberías sentirte prioridad — cuando se llena de lo de otros, tu tiempo también se siente secundario.", "order": "Despeja la mesa antes de cenar, aunque sea comiendo tú sola/o.", "bonus": "Enciende una vela o pon algo que te guste ver antes de sentarte a comer.", "self_line": "Esto también podría hablar de si sientes que tu tiempo y tu espacio se respetan.", "variants": null}, {"key": "wardrobe", "label": "Guardarropa", "accent": "#96BC78", "quote": "Visto quién eres, si me dejas.", "meaning": "El sistema no siempre es el problema — a veces sigues vistiendo una versión de ti que ya no te representa.", "order": "Elige 5 prendas que ya no representan quién eres hoy y sácalas del clóset.", "bonus": "Cuelga primero las prendas que sí te hacen sentir bien, para que sean las primeras que veas.", "self_line": "Esto también podría ser una señal de cuánto te permites tener — y usar — lo bueno.", "variants": null}, {"key": "office", "label": "Oficina", "accent": "#96BC78", "quote": "Sostengo tus decisiones, aunque no lo notes.", "meaning": "Es donde tomas tus decisiones — el desorden visual te hace más difícil pensar con claridad.", "order": "Al final del día, deja el escritorio con solo 3 cosas encima.", "bonus": "Agrega una planta o algo que te guste ver mientras trabajas.", "self_line": "Esto también podría estar señalando un límite entre trabajar y cuidarte mientras trabajas.", "variants": null}, {"key": "bedroom", "label": "Habitación", "accent": "#96BC78", "quote": "Te suelto el día, si tú me lo permites.", "meaning": "Tu descanso más profundo ocurre aquí — si el espacio no te representa, tu cuerpo tampoco termina de soltar el día.", "order": "Guarda fuera de vista lo que ya no usas y que ocupa la habitación.", "bonus": "Cambia solo una cosa esta semana: la funda de almohada, una lámpara, o mueve un mueble.", "self_line": "Esto también podría hablar de si te permites un descanso que sí te represente hoy.", "variants": {"sola": "Guarda fuera de vista lo que ya no usas y que ocupa la habitación.", "pareja": "Negocien juntos un cambio pequeño al espacio compartido esta semana.", "ninos": "Asegura que su cuarto tenga un sistema simple que ellos puedan mantener solos.", "adolescentes": "Dales autonomía total sobre su espacio — con un único acuerdo básico.", "otros": "Define con claridad qué áreas son privadas y cuáles compartidas."}}, {"key": "garden", "label": "Patio/Jardín/Balcón", "accent": "#96BC78", "quote": "Te recuerdo que existe el aire libre.", "meaning": "Es tu conexión con el aire libre — cuando se abandona, también dejas de darte ese respiro.", "order": "Riega lo que aún se pueda salvar, o retira lo que ya no.", "bonus": "Siéntate afuera 5 minutos hoy sin celular.", "self_line": "Esto también podría ser un recordatorio de cuidarte a ti, no solo lo que te rodea.", "variants": null}], "en": [{"key": "entryway", "label": "Entryway", "accent": "#96BC78", "quote": "I welcome you exactly as you arrive.", "meaning": "It's the first filter between the world and you — when it's cluttered, you walk into your home already tired.", "order": "Set up one fixed spot for whatever comes through that door.", "bonus": "Add something you love seeing every time you arrive — a rug, a plant, warm lighting.", "self_line": "This could also be pointing to a boundary: deciding what gets to enter your space, and what doesn't.", "variants": {"sola": "Set up one fixed spot for whatever comes through that door.", "pareja": "Agree on a set spot for each of you, without crowding the other's.", "ninos": "Give each child their own hook or basket, at their height.", "adolescentes": "Give each teen their own hook for bag and jacket.", "otros": "Assign each person a clearly defined spot."}}, {"key": "laundry", "label": "Laundry", "accent": "#96BC78", "quote": "I'm holding what you haven't let go of yet.", "meaning": "It's the part of the day that feels invisible — without a system, it becomes a quiet load that follows you everywhere.", "order": "Work out whether the real bottleneck is dirty washing or clean washing, and fix just that step this week.", "bonus": null, "self_line": "This could also be a sign you need the load shared, not all on you.", "variants": {"sola": "Set up one fixed spot (basket or shelf) so laundry doesn't spread to another room.", "pareja": "Talk about who washes and who puts away, so it's not always the same person.", "ninos": "Teach them to fold and put away their own clothes — start with something simple.", "adolescentes": "Give each teen the full cycle: wash, dry, fold, and put away.", "otros": "Set up a clear roster for shared laundry."}}, {"key": "bathroom", "label": "Bathroom", "accent": "#96BC78", "quote": "This is where your day begins and ends.", "meaning": "It's the space for your own care — when it's neglected, it's a sign you're putting yourself last on the list.", "order": "Wipe down the basin right after your morning routine, as a ritual, not a chore.", "bonus": null, "self_line": "This could also speak to how much you let yourself be looked after before others.", "variants": null}, {"key": "kitchen", "label": "Kitchen & Pantry", "accent": "#96BC78", "quote": "I feed everyone, including you.", "meaning": "You look after everyone, but the “after” of caring feels like an endless debt.", "order": "Leave the sink empty before bed — even if that's all you do.", "bonus": null, "self_line": "This could also be an unset boundary: asking for this to be everyone's job, not just yours.", "variants": {"sola": "Leave the sink empty before bed — even if that's all you do.", "pareja": "Take turns: one night whoever cooked washes up, the next night the other does.", "ninos": "Have each child carry their own plate to the sink after eating.", "adolescentes": "Set a fixed roster for washing and putting away — they can handle the full process.", "otros": "Set up a clear roster by day of the week."}}, {"key": "living", "label": "Living Room", "accent": "#96BC78", "quote": "I'm waiting for you to finally sit down.", "meaning": "It's your space to rest — if it's taken up by everyone else's things but yours, your body can't fully let go.", "order": "At the end of the day, put back what isn't yours from the couch.", "bonus": "Set aside 10 minutes there just for you, screen-free.", "self_line": "This could also be pointing to how hard it is for you to give yourself permission to simply rest.", "variants": {"sola": "Give yourself permission to use the whole living room for you, not just ‘save it’ for guests.", "pareja": "Agree on a screen-free hour there, just the two of you, even 15 minutes.", "ninos": "Set a clear boundary on toys: which ones live in the living room, and which don't.", "adolescentes": "Negotiate a shared schedule for the main screen, visible to everyone.", "otros": "Agree on which areas of the living room are shared and which are personal."}}, {"key": "dining", "label": "Dining Area", "accent": "#96BC78", "quote": "I bring people together, even when you use me for everything but that.", "meaning": "It's the place where you should feel like a priority — when it fills up with everyone else's things, your time starts to feel secondary too.", "order": "Clear the table before dinner, even if you're eating alone.", "bonus": "Light a candle or put out something you love looking at before you sit down to eat.", "self_line": "This could also speak to whether you feel your time and space are respected.", "variants": null}, {"key": "wardrobe", "label": "Wardrobe", "accent": "#96BC78", "quote": "I dress who you are, if you let me.", "meaning": "The system isn't always the problem — sometimes you're still dressing a version of yourself that no longer represents you.", "order": "Choose 5 items that no longer represent who you are today and take them out of the wardrobe.", "bonus": "Hang the pieces that actually make you feel good at the front, so they're the first thing you see.", "self_line": "This could also be a sign of how much you let yourself have — and use — the good stuff.", "variants": null}, {"key": "office", "label": "Home Office", "accent": "#96BC78", "quote": "I hold your decisions, even when you don't notice.", "meaning": "It's where you make your decisions — visual clutter makes it harder to think clearly.", "order": "At the end of the day, leave the desk with only 3 things on it.", "bonus": "Add a plant or something you enjoy looking at while you work.", "self_line": "This could also be pointing to a boundary between working and looking after yourself while you work.", "variants": null}, {"key": "bedroom", "label": "Bedroom", "accent": "#96BC78", "quote": "I let your day go, if you let me.", "meaning": "Your deepest rest happens here — if the space doesn't represent you, your body can't fully let go of the day either.", "order": "Put away, out of sight, anything you no longer use that's taking up space in the bedroom.", "bonus": "Change just one thing this week: the pillowcase, a lamp, or move a piece of furniture.", "self_line": "This could also speak to whether you're allowing yourself a rest that actually represents you today.", "variants": {"sola": "Put away, out of sight, anything you no longer use that's taking up space in the bedroom.", "pareja": "Negotiate one small change to the shared space together this week.", "ninos": "Make sure their room has a simple system they can maintain on their own.", "adolescentes": "Give them full ownership of their space — with one basic agreement.", "otros": "Be clear about which areas are private and which are shared."}}, {"key": "garden", "label": "Patio/Garden/Balcony", "accent": "#96BC78", "quote": "I remind you that fresh air exists.", "meaning": "It's your connection to the outdoors — when it's neglected, you also stop giving yourself that breather.", "order": "Water whatever can still be saved, or clear out what can't.", "bonus": "Sit outside for 5 minutes today without your phone.", "self_line": "This could also be a reminder to look after yourself, not just what's around you.", "variants": null}]};

function dots(friction) {
  let s='';
  for (let i=0;i<5;i++) s += `<span style="color:${i<friction?'var(--apple)':'var(--dove)'}">${i<friction?'\u25CF':'\u25CB'}</span> `;
  return s;
}

function buildRadarSVG(labels, scores, axisColors) {
  const n = scores.length, size=340, cx=size/2, cy=size/2, maxR=110;
  const lineColor = '#716D71';
  let svg = `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">`;
  [1,2,3,4,5].forEach(ring => {
    let r=(ring/5)*maxR, pts=[];
    for (let i=0;i<n;i++){ let a=(Math.PI*2*i/n)-Math.PI/2; pts.push(`${cx+r*Math.cos(a)},${cy+r*Math.sin(a)}`); }
    svg += `<polygon points="${pts.join(' ')}" fill="none" stroke="#E4E4DE" stroke-width="1" stroke-dasharray="2,3"/>`;
  });
  for (let i=0;i<n;i++){ let a=(Math.PI*2*i/n)-Math.PI/2; svg += `<line x1="${cx}" y1="${cy}" x2="${cx+maxR*Math.cos(a)}" y2="${cy+maxR*Math.sin(a)}" stroke="#E4E4DE" stroke-width="1"/>`; }
  let pts=[];
  scores.forEach((s,i)=>{ let a=(Math.PI*2*i/n)-Math.PI/2, r=(s/5)*maxR; pts.push([cx+r*Math.cos(a), cy+r*Math.sin(a)]); });
  svg += `<polygon points="${pts.map(p=>p.join(',')).join(' ')}" fill="${lineColor}" fill-opacity="0.06" stroke="${lineColor}" stroke-width="2"/>`;
  pts.forEach((p,i)=>{ svg += `<circle cx="${p[0]}" cy="${p[1]}" r="6" fill="${axisColors[i % axisColors.length]}" stroke="#fff" stroke-width="1.5"/>`; });
  labels.forEach((lab,i)=>{ let a=(Math.PI*2*i/n)-Math.PI/2, lx=cx+(maxR+26)*Math.cos(a), ly=cy+(maxR+26)*Math.sin(a);
    svg += `<text x="${lx}" y="${ly}" font-size="10.5" font-weight="700" fill="${axisColors[i % axisColors.length]}" text-anchor="middle" dominant-baseline="middle">${lab}</text>`; });
  svg += '</svg>';
  return svg;
}

  html += `<span class="badge-tag">${T.fullBadge}</span><h1>${T.houseMsgH1}</h1>`;
  if (synth && synth.houseMessage) {
    html += `<div class="quote-block">\u201C${synth.houseMessage}\u201D</div>`;
  } else if (houseVoice.trim()) {
    html += `<div class="quote-block">\u201C${houseVoice.trim()}\u201D</div>`;
    html += `<p>${T.houseMsgFallback}, ${name}.</p>`;
  } else {
    html += `<p>\u201C${priorityRoom.self_line}\u201D</p>`;
  }

  html += `<h2>${T.lifeWheelH2}</h2>`;
  html += `<div class="wheel-wrap">${buildRadarSVG(LIFE_AREAS, lifeScores, LIFE_PALETTE)}</div>`;
  html += `<h2>${T.homeWheelH2}</h2>`;
  html += `<div class="wheel-wrap">${buildRadarSVG(ROOMS.map(r=>r.label), homeScores, HOME_PALETTE)}</div>`;
  if (synth && synth.lifeHomeConnection) {
    html += `<div class="connection-box">${synth.lifeHomeConnection}</div>`;
  }

  const strengthDisplay = (synth && synth.strengthText) ? synth.strengthText :
    (peaceWhy.trim() ? peaceWhy.trim() : T.strengthP2);
  html += `<div class="strength-box"><div class="eyebrow">${T.strengthPrefix}${strengthRoom.label.toUpperCase()}</div>
    <p style="margin-top:10px">${strengthDisplay}</p>
    <p>${T.strengthP2}</p></div>`;

  html += `<div class="priority-box"><div class="eyebrow">${T.priorityEyebrow}</div>
    <p style="font-size:22px;font-weight:700;color:var(--mushroom);margin:6px 0">${priorityRoom.label}</p>
    <p>${T.priorityP}</p></div>`;

  html += `<h2>${T.allRoomsH2}</h2>`;
  sorted.forEach(r => {
    const synthSymptom = synth && synth.roomSymptoms && synth.roomSymptoms[r.key] ? synth.roomSymptoms[r.key] : null;
    const raw = roomRaw[r.key];
    html += roomCardHTML(r, r.friction, household, synthSymptom || raw);
  });

  html += `<h2>${T.guideH2}</h2>`;
  ROOMS.forEach(r => {
    html += `<div class="tip-group"><h4>${r.label}</h4><ul>${TIP_MAP[r.key].map(t=>`<li>${t}</li>`).join('')}</ul></div>`;
  });

  if (DEBUG_MODE) {
    html += `<div class="note">${synth ? T.noteOk : T.noteFail} ${T.noteEnd}</div>`;
  }

  document.getElementById('paidFormSection').style.display='none';
  document.getElementById('paidReportSection').innerHTML = html;
  window.scrollTo(0,0);
}
</script>
